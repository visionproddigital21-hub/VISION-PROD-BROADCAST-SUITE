<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">

<title>Lower Third - VISION PROD TV</title>

<style>

body {

margin:0;
background:transparent;
overflow:hidden;
font-family:Arial, Helvetica, sans-serif;

}


.lowerthird {

position:absolute;
left:80px;
bottom:100px;

width:800px;
height:120px;

background:rgba(17,17,17,0.90);

border-left:8px solid #D4AF37;

color:white;

padding:20px;

box-sizing:border-box;

animation:slide 1s ease;

}



.channel {

color:#D4AF37;

font-size:22px;

font-weight:bold;

}



.name {

font-size:42px;

font-weight:bold;

margin-top:5px;

}



.role {

font-size:22px;

color:#ddd;

}



@keyframes slide {

from {

transform:translateX(-900px);
opacity:0;

}

to {

transform:translateX(0);
opacity:1;

}

}


</style>

</head>


<body>


<div class="lowerthird">


<div class="channel">
VISION PROD TV
</div>


<div class="name">
SOMDA FRANCK
</div>


<div class="role">
Présentateur / Journaliste
</div>


</div>


</body>

</html>
