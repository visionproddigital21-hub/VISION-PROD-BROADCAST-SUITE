<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">
<title>VISION PROD TV - Control Center</title>

<link rel="stylesheet" href="../css/main.css">

<style>

body {
    background:#111;
    color:white;
    padding:40px;
}


.panel {

    width:600px;
    margin:auto;
    background:#1b1b1b;
    padding:30px;
    border-left:8px solid #D4AF37;
    border-radius:10px;

}


h1 {

    color:#D4AF37;
    text-align:center;

}


label {

    display:block;
    margin-top:20px;

}


input, textarea {

    width:100%;
    padding:12px;
    margin-top:8px;
    background:#222;
    color:white;
    border:1px solid #555;

}


button {

    margin-top:30px;
    width:100%;
    padding:15px;
    background:#D4AF37;
    border:none;
    font-weight:bold;
    cursor:pointer;

}

</style>

</head>


<body>


<div class="panel">

<h1>
VISION PROD TV
</h1>

<h2>
Broadcast Control Center
</h2>


<label>
Présentateur
</label>

<input value="SOMDA FRANCK">


<label>
Fonction
</label>

<input value="Présentateur / Journaliste">


<label>
Flash Info
</label>

<textarea rows="4">
Bienvenue sur VISION PROD TV
</textarea>


<button>
METTRE À JOUR
</button>


</div>


</body>

</html>
